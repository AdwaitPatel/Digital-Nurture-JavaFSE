services:
  app:
    build: .
    container_name: student-app
    ports:
      - "9001:8080"
    depends_on:
      - mysql

  mysql:
    image: mysql:8.4
    container_name: mysql-db
    environment:
      MYSQL_DATABASE: student_db
      MYSQL_USER: adwait
      MYSQL_PASSWORD: 1234
      MYSQL_ROOT_PASSWORD: 12qw
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data: